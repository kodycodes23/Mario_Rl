# Stage 1: continue from the level-1 agent, mix in level 2.
# Keep sampling level 1 most of the time so it is not forgotten.
seed: 0

env:
  level_path: game/levels/level_1.json
  eval_level_path: game/levels/level_1.json
  train_level_paths:
    - game/levels/level_1.json
    - game/levels/level_2.json
  train_level_weights: [0.65, 0.35]
  procgen: false
  max_episode_steps: 3600
  frame_skip: 2
  sticky_action_p: 0.0
  reward_mode: shaped_time
  n_envs: 8

ppo:
  policy: MlpPolicy
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02
  vf_coef: 0.5
  learning_rate: 0.0001
  total_timesteps: 2000000
  policy_kwargs:
    net_arch: [128, 128]

eval:
  eval_freq: 20000
  n_eval_episodes: 10
  deterministic: true
  min_l1_completion: 0.5
  level_paths:
    - game/levels/level_1.json
    - game/levels/level_2.json

checkpoint:
  save_freq: 100000
